
name: Build Gyasi Jimxy Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'GyasiJimxyStore-AndroidStudio-Project.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Download project from repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          unzip -o GyasiJimxyStore-AndroidStudio-Project.zip
          test -f GyasiJimxyStore/settings.gradle
          test -f GyasiJimxyStore/app/build.gradle

      - name: Build APK
        run: |
          gradle -p GyasiJimxyStore \
            --no-daemon \
            assembleDebug

        - name: Inspect APK
        run: |
          APK="GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk"

          echo "APK CONTENTS:"
          unzip -l "$APK"

          echo "CHECK DEX FILE:"
          unzip -l "$APK" | grep classes.dex

          echo "CHECK APK SIGNATURE:"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo "APK SIZE:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gyasi-Jimxy-Store-APK
          path: GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
