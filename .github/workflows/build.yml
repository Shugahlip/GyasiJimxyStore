
name: Build Gyasi Jimxy Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o GyasiJimxyStore-AndroidStudio-Project.zip

      - name: Build APK
        run: gradle -p GyasiJimxyStore assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gyasi-Jimxy-Store-APK
          path: GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk
