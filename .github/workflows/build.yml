
name: Build Gyasi Jimxy Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'GyasiJimxyStore-AndroidStudio-Project.zip'

permissions:
  contents: read

jobs:
  build:
    name: Compile and Verify Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$SDK" ]; then
            echo "Android SDK location not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK: $SDK"

      - name: Install Android SDK components
        run: |
          SDK="$ANDROID_HOME"
          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract Android project
        run: |
          test -f GyasiJimxyStore-AndroidStudio-Project.zip
          unzip -o GyasiJimxyStore-AndroidStudio-Project.zip

          test -f GyasiJimxyStore/settings.gradle
          test -f GyasiJimxyStore/app/build.gradle
          test -f GyasiJimxyStore/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          gradle -p GyasiJimxyStore \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK file
        run: |
          APK="GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK FILE SIZE:"
          ls -lh "$APK"

          echo "APK CONTENTS:"
          unzip -l "$APK"

          echo "CHECK COMPILED ANDROID CODE:"
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex'

          echo "CHECK ANDROID MANIFEST:"
          unzip -l "$APK" | grep 'AndroidManifest.xml'

      - name: Verify APK signature
        run: |
          APK="GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools/35.0.0" \
            -name apksigner -type f | head -n 1)

          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Verify app package
        run: |
          APK="GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK" | head -n 5

          "$AAPT" dump badging "$APK" | \
            grep -F "com.gyasijimxystore.app"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Gyasi-Jimxy-Store-APK
          path: GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
