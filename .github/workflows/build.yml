
name: Build Gyasi Jimxy Store APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o GyasiJimxyStore-AndroidStudio-Project.zip

      - name: Build Android APK
        run: gradle -p GyasiJimxyStore assembleDebug

      - name: Verify APK exists
        run: |
          APK="GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Gyasi-Jimxy-Store-APK
          path: GyasiJimxyStore/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
